body {

.top {

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-weight: 700; font-size: .95rem; }

main {

  display: grid; gap: 18px;
}
.sheet {
  background: var(--sheet); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 22px 22px 22px 34px; position: relative; min-width: 0;
  display: grid; gap: 14px;
}
.sheet::before { content: ""; position: absolute; left: 18px; top: 0; bottom: 0; width: 2px; background: var(--margin); opacity: .55; }
.muted { color: var(--ink-soft); }

  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;

.btn.ghost { background: transparent; color: var(--blue); }
.btn.soft { background: var(--blue-soft); color: var(--blue); border-color: transparent; }

.note { padding: 12px 14px; border-radius: 12px; background: var(--blue-soft); color: var(--ink); }
.note.warn { background: var(--warn-soft); }

.grid-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.tile {
  text-align: left; border: 2px solid var(--border); background: var(--sheet); border-radius: var(--radius);
  padding: 16px; display: grid; gap: 6px; align-content: start; min-height: 110px; box-shadow: var(--shadow);
}
.tile:hover { border-color: var(--blue); }
.tile .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; }
.tile .ico svg { width: 24px; height: 24px; }
.tile b { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.tile span { color: var(--ink-soft); font-size: .95rem; }
.tile.main { border-color: var(--blue); background: var(--blue-soft); }
.tile.mf3, .tile.mf4 { border-left-width: 7px; }
.tile.mf3 { border-left-color: var(--mf3); }
.tile.mf4 { border-left-color: var(--mf4); }
.tone { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; color: #fff; }
.tone.mf3 { background: var(--mf3); } .tone.mf4 { background: var(--mf4); }

.who-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.who { min-height: 80px; border-radius: 16px; border: 2px solid var(--border); background: var(--sheet); font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: var(--blue); }

.pics { display: grid; grid-template-columns: repeat(3, minmax(0, 96px)); gap: 12px; justify-content: center; }
.pic { aspect-ratio: 1; max-width: 100%; border-radius: 18px; border: 2px solid var(--border); background: var(--sheet); font-size: 2.6rem; display: grid; place-items: center; position: relative; }
.pic.on { border-color: var(--blue); background: var(--blue-soft); }
.pic .n { position: absolute; top: 4px; right: 8px; font-size: .9rem; font-weight: 700; color: var(--blue); }
.dots { display: flex; gap: 10px; justify-content: center; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--blue); }
.dots i.on { background: var(--blue); }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

/* Karteikasten mit 5 Fächern */
.box { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; align-items: end; }
.fach { display: grid; gap: 6px; justify-items: center; }
.fach .well { width: 100%; height: 96px; border-radius: 10px 10px 6px 6px; border: 2px solid var(--border); background: var(--paper); display: flex; align-items: flex-end; overflow: hidden; }
.fach .fill { width: 100%; border-radius: 6px 6px 0 0; transition: height .4s; }
.fach .num { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.fach .lab { font-size: .8rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
.c1 { background: var(--f1); } .c2 { background: var(--f2); } .c3 { background: var(--f3); } .c4 { background: var(--f4); } .c5 { background: var(--f5); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .85rem; font-weight: 700; color: #fff; }
.pill.c3 { color: #1d2340; }

.seg { display: inline-flex; border: 2px solid var(--border); border-radius: 14px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 14px; min-height: 44px; font-weight: 700; color: var(--ink-soft); }
.seg button.on { background: var(--blue); color: var(--sheet); }

/* Lernkarte */
.card {
  background: var(--sheet); border: 2px solid var(--border); border-radius: 22px; box-shadow: var(--shadow);
  padding: 26px 20px; display: grid; gap: 14px; justify-items: center; text-align: center; min-height: 260px; align-content: center;
}
.card .emo { font-size: 4.2rem; line-height: 1; }
.card .de { font-size: 1.6rem; font-weight: 700; }
.card .fr { font-family: var(--font-display); font-size: 2.1rem; font-weight: 800; color: var(--blue); }
.speak { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--blue); background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; }
.speak.big { width: 96px; height: 96px; }
.speak svg { width: 50%; height: 50%; }
.accents { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.accents button { min-width: 44px; min-height: 44px; border-radius: 10px; border: 2px solid var(--border); background: var(--paper); font-size: 1.2rem; font-weight: 700; }
.feedback { border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; text-align: center; width: 100%; }
.feedback.ok { background: var(--good-soft); color: var(--good); }

.feedback .sol { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: var(--ink); }
.progress { height: 10px; border-radius: 999px; background: var(--blue-soft); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--blue); border-radius: 999px; transition: width .3s; }
.progress.stacked { display: flex; height: 14px; }
.progress.stacked i { border-radius: 0; }
.progress.stacked i.c1 { background: var(--f1); } .progress.stacked i.c2 { background: var(--f2); } .progress.stacked i.c3 { background: var(--f3); } .progress.stacked i.c4 { background: var(--f4); } .progress.stacked i.c5 { background: var(--f5); }

.big-num { font-family: var(--font-display); font-size: 3rem; font-weight: 800; color: var(--blue); font-variant-numeric: tabular-nums; line-height: 1; }

.scroll { overflow-x: auto; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }

.fc { display: inline-flex; gap: 5px; align-items: center; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); font-size: .85rem; font-variant-numeric: tabular-nums; }
.fc i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.kid-actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.kid-actions .badge { align-self: center; text-align: center; }
@media (max-width: 640px) { .kid { grid-template-columns: minmax(0, 1fr); } .kid-actions { flex-direction: row; flex-wrap: wrap; align-items: center; } }

.duel { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: grid; grid-template-rows: 1fr auto 1fr; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.half { display: grid; gap: 10px; align-content: center; justify-items: center; padding: 12px max(16px, env(safe-area-inset-left, 0px)) 12px max(16px, env(safe-area-inset-right, 0px)); min-height: 0; }
.half.p2 { transform: rotate(180deg); }
.half .who-l { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.half .fr { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: var(--blue); }
.half .opts { max-width: 560px; }
.half .opt { min-height: 64px; }
.half.won { background: var(--good-soft); }
.half.lock .opts { opacity: .4; }
.mid { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--sheet); border-block: 2px solid var(--border); }
.mid .score { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; }

.stars { font-size: 2.4rem; letter-spacing: 6px; color: var(--f3); }
.pop { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.92); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pop, .shake { animation: none; } .fach .fill, .progress i { transition: none; } }
@media (max-width: 520px) {
  body { font-size: 17px; }
  .sheet { padding: 18px 16px 18px 28px; }
  .sheet::before { left: 13px; }
  .mem { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card .fr { font-size: 1.7rem; }
  .half .opt { min-height: 56px; font-size: 1rem; }
}

  // ---------- Import (Excel, CSV, Einfügen) ----------
  function parseDelimited(text) {
    text = text.replace(/^﻿/, '');
    var firstLine = text.split(/\r?\n/)[0] || '';
    var delim = firstLine.indexOf('\t') >= 0 ? '\t' : (firstLine.split(';').length >= firstLine.split(',').length ? ';' : ',');
    var rows = [], row = [], cell = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"' && cell === '') q = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return String(x).trim(); }); });
  }
  function rowsToDecks(rows, fallback) {
    if (!rows.length) return [];
    var h = rows[0].map(function (x) { return String(x).toLowerCase().trim(); });
    var idx = { fr: 0, de: 1, th: 2, img: 3 };
    var isHeader = h.some(function (x) { return /franz|fran[cç]ais|deutsch|^fr$|^de$/.test(x); });
    if (isHeader) {
      var find = function (re, d) { for (var i = 0; i < h.length; i++) if (re.test(h[i])) return i; return d; };
      idx = { fr: find(/franz|fran[cç]ais|^fr$/, 0), de: find(/deutsch|^de$/, 1), th: find(/thema|kapitel|unit|lektion/, -1), img: find(/bild|emoji|pikto/, -1) };
      rows = rows.slice(1);
    }
    var groups = {}, order = [];
    rows.forEach(function (r) {
      var fr = String(r[idx.fr] || '').trim(), de = String(r[idx.de] || '').trim();
      if (!fr || !de) return;
      var th = idx.th >= 0 ? String(r[idx.th] || '').trim() : '';
      var title = th || fallback || 'Neue Kartei';
      if (!groups[title]) { groups[title] = []; order.push(title); }
      groups[title].push({ fr: fr, de: de, img: idx.img >= 0 ? String(r[idx.img] || '').trim() : '' });
    });
    return order.map(function (t) { return { title: t, words: groups[t] }; });
  }
  function mergeDecks(newDecks) {
    var d = draft(); var added = 0, made = 0;
    newDecks.forEach(function (nd) {
      var k = d.decks.filter(function (x) { return x.title.toLowerCase() === nd.title.toLowerCase(); })[0];
      if (!k) { k = { id: 'd' + hash(nd.title + Date.now() + Math.random()), title: nd.title, words: [] }; d.decks.push(k); made++; }
      nd.words.forEach(function (w) {
        w.id = wid(w.fr, w.de);
        if (!k.words.some(function (x) { return x.id === w.id; })) { k.words.push(w); added++; }
      });
    });
    save();
    return added + ' Wörter übernommen' + (made ? ', ' + made + ' neue Kartei' + (made > 1 ? 'en' : '') : '') + (MODE === 'datei' ? '. Lade am Schluss unter «App-Datei» die neue Datei herunter.' : '. Vergiss nicht, am Schluss zu veröffentlichen.');
  }
  // Kleiner .xlsx-Leser: .xlsx ist ein ZIP mit XML-Dateien
  function readXlsx(buf) {
    var u8 = new Uint8Array(buf), dv = new DataView(buf);
    var eocd = -1;
    for (var i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    if (eocd < 0) return Promise.reject(new Error('Die Datei ist keine gültige Excel-Datei.'));
    var n = dv.getUint16(eocd + 10, true), off = dv.getUint32(eocd + 16, true), entries = {};
    for (var k = 0; k < n; k++) {
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      var method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
      var nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
      var name = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nl));
      entries[name] = { method: method, csize: csize, lho: lho };
      off += 46 + nl + el + cl;
    }
    function file(name) {
      var e = entries[name]; if (!e) return Promise.resolve(null);
      var start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
      var data = u8.subarray(start, start + e.csize);
      if (e.method === 0) return Promise.resolve(new TextDecoder().decode(data));
      if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('Dieser Browser kann .xlsx nicht lesen. Kopiere die Zellen und füge sie unten ein.'));
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    }
    var sheetName = entries['xl/worksheets/sheet1.xml'] ? 'xl/worksheets/sheet1.xml' : Object.keys(entries).filter(function (x) { return /^xl\/worksheets\/[^/]+\.xml$/.test(x); }).sort()[0];
    return Promise.all([file('xl/sharedStrings.xml'), file(sheetName)]).then(function (res) {
      var parser = new DOMParser();
      var strings = [];
      if (res[0]) {
        var sdoc = parser.parseFromString(res[0], 'application/xml');
        Array.prototype.forEach.call(sdoc.getElementsByTagName('si'), function (si) {
          strings.push(Array.prototype.map.call(si.getElementsByTagName('t'), function (t) { return t.textContent; }).join(''));
        });
      }
      if (!res[1]) throw new Error('In der Datei wurde keine Tabelle gefunden.');
      var doc = parser.parseFromString(res[1], 'application/xml');
      var out = [];
      Array.prototype.forEach.call(doc.getElementsByTagName('row'), function (row) {
        var r = [];
        Array.prototype.forEach.call(row.getElementsByTagName('c'), function (c) {
          var ref = c.getAttribute('r') || '', letters = (ref.match(/^[A-Z]+/) || ['A'])[0], col = 0;
          for (var j = 0; j < letters.length; j++) col = col * 26 + (letters.charCodeAt(j) - 64);
          var t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0], val = '';
          if (t === 's' && v) val = strings[+v.textContent] || '';
          else if (t === 'inlineStr') val = Array.prototype.map.call(c.getElementsByTagName('t'), function (x) { return x.textContent; }).join('');
          else if (v) val = v.textContent;
          r[col - 1] = val;
        });
        for (var z = 0; z < r.length; z++) if (r[z] == null) r[z] = '';
        if (r.some(function (x) { return String(x).trim(); })) out.push(r);
      });
      return out;
    });
  }

  // ---------- Spielabläufe ----------

    pool = shuffle(pool).sort(function (a, b) { return fachOf(pr, a) - fachOf(pr, b); }).slice(0, 12);
    if (!pool.length) return;
    go('kk', { list: pool, i: 0, state: 'ask', right: 0 });
  }
  function kkAnswer(ok, result, typed) {
    var c = S.ctx, k = findDeck(S.deck), w = c.list[c.i];

    grade(k.id, w, ok, true);

  }

  }
  function memStart() {

  }

      var c = S.ctx, d = draft();
      var words = c.rows.filter(function (r) { return r.fr.trim() && r.de.trim(); }).map(function (r) { return { id: wid(r.fr, r.de), fr: r.fr.trim(), de: r.de.trim(), img: r.img.trim() }; });
      var k = c.id && d.decks.filter(function (x) { return x.id === c.id; })[0];
      if (!k) { k = { id: 'd' + hash(c.title + Date.now()), title: '', words: [] }; d.decks.push(k); }
      k.title = c.title.trim() || 'Ohne Namen'; k.words = words;
      save(); S.tab = 'karteien'; go('teacher', { msg: 'Kartei «' + esc(k.title) + '» gespeichert (' + words.length + ' Wörter).' });
    },
    deckDel: function () { readRows(); S.ctx.confirmDel = true; render(); },
    deckDelNo: function () { readRows(); S.ctx.confirmDel = false; render(); },
    deckDelYes: function () {
      var d = draft(); d.decks = d.decks.filter(function (x) { return x.id !== S.ctx.id; }); save(); S.tab = 'karteien'; go('teacher');
    },
    importPaste: function () {
      var t = document.getElementById('paste').value, fb = document.getElementById('fallback').value;
      if (!t.trim()) { S.ctx.msg = 'Füge zuerst Zellen aus Excel ins Feld ein.'; return render(); }
      S.ctx.fallback = fb;
      S.ctx.msg = esc(mergeDecks(rowsToDecks(parseDelimited(t), fb)));
      render();
    },
    classDel: function (el) { S.ctx.delClass = el.dataset.code; render(); },
    classDelYes: function (el) { var d = draft(); d.classes = d.classes.filter(function (c) { return c.code !== el.dataset.code; }); save(); go('teacher'); },
    pwReset: function (el) { var p = store.profiles[el.dataset.id]; p.pw = null; save(); S.ctx.msg = p.kuerzel + ' wählt beim nächsten Anmelden ein neues Bild-Passwort.'; render(); },
    profileDel: function (el) { S.ctx.delProfile = el.dataset.id; render(); },
    profileDelYes: function (el) { delete store.profiles[el.dataset.id]; save(); S.ctx.delProfile = null; render(); },
    copyTable: function () {
      var deck = findDeck(S.ctx.dk || (D().decks[0] && D().decks[0].id));
      var lines = [['Kürzel', 'Fach 1', 'Fach 2', 'Fach 3', 'Fach 4', 'Fach 5', 'Zuletzt', 'Schwierige Wörter', 'Kartei'].join('\t')];
      (S.ctx.tableRows || []).forEach(function (r) { lines.push([r.p.kuerzel, r.c[1], r.c[2], r.c[3], r.c[4], r.c[5], fmtDate(r.p.last), r.hard.join(', '), deck ? deck.title : ''].join('\t')); });
      var text = lines.join('\n');
      var done = function () { S.ctx.msg = 'Tabelle kopiert. In Excel einfügen.'; render(); };
      try { navigator.clipboard.writeText(text).then(done, function () { S.ctx.msg = 'Kopieren ging nicht. Bitte die Tabelle von Hand markieren.'; render(); }); }
      catch (e) { S.ctx.msg = 'Kopieren ging nicht. Bitte die Tabelle von Hand markieren.'; render(); }
    },
    publish: publish,
    downloadFile: downloadFile,
    discard: function () { S.ctx.discard = true; render(); },
    discardYes: function () { delete store.draft; save(); go('teacher', { msg: 'Änderungen verworfen.' }); }
  };
  function nextDuel() {
    var c = S.ctx;
    if (S.view !== 'duel') return;
    c.round++;
    if (c.round >= c.rounds) return duelEnd();
    duelNewRound(c); render();
  }
  function readRows() {
    var c = S.ctx;
    var t = document.getElementById('dt'); if (t) c.title = t.value;
    Array.prototype.forEach.call(document.querySelectorAll('[data-row]'), function (inp) { var r = c.rows[+inp.dataset.row]; if (r) r[inp.dataset.k] = inp.value; });
  }
  function enterClass(code) {
    code = String(code || '').toUpperCase().replace(/\s+/g, '');
    var cl = findClass(code);
    if (!cl) return go('start', { code: code, err: code ? 'Diesen Klassencode gibt es nicht. Frag deine Lehrperson.' : 'Bitte gib den Klassencode ein.' });
    store.recent = [cl.code].concat(store.recent.filter(function (c) { return c !== cl.code; })).slice(0, 4); save();
    go('who', { code: cl.code });
  }
  function picDone() {
    var c = S.ctx;
    if (S.view === 'pwSet') {
      if (c.step === 1) { c.first = c.sel.slice(); c.step = 2; c.sel = []; return render(); }
      if (c.first.join() !== c.sel.join()) { c.step = 1; c.sel = []; c.first = null; c.err = 'Das war nicht gleich. Bitte nochmals von vorne.'; return render(); }
      var p;
      if (c.id) p = store.profiles[c.id];
      else { p = { id: 'p' + hash(c.code + c.kuerzel + Date.now() + Math.random()), klasse: c.code, kuerzel: c.kuerzel, created: Date.now() }; store.profiles[p.id] = p; }
      p.pw = c.first; p.prefs = p.prefs || { dir: 'see', ans: 'write' }; save();
      S.me = p.id; return go('home');
    }
    if (S.view === 'pwLogin') {
      var pr = store.profiles[c.id];
      if (pr.pw && pr.pw.join() === c.sel.join()) { S.me = pr.id; pr.prefs = pr.prefs || { dir: 'see', ans: 'write' }; return go('home'); }
      c.sel = []; c.err = 'Das stimmt leider nicht. Versuch es nochmals.';
      render();
      var g = document.getElementById('pics'); if (g) g.classList.add('shake');
    }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACT[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'answer') S.ctx.typed = e.target.value;
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.change === 'ovCls') { S.ctx.cls = t.value; S.ctx.delProfile = null; render(); }
    if (t.dataset.change === 'ovDeck') { S.ctx.dk = t.value; render(); }
    if (t.id === 'file' && t.files && t.files[0]) {
      var f = t.files[0], fb = (document.getElementById('fallback') || {}).value || f.name.replace(/\.[^.]+$/, '');
      S.ctx.fallback = fb;
      var p = /\.xlsx$/i.test(f.name) ? f.arrayBuffer().then(readXlsx) : f.text().then(parseDelimited);
      p.then(function (rows) { S.ctx.msg = esc(mergeDecks(rowsToDecks(rows, fb))); render(); })
        .catch(function (err) { S.ctx.msg = esc(err && err.message ? err.message : 'Die Datei konnte nicht gelesen werden.'); render(); });
    }
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, kind = f.dataset.form, val = function (n) { return f.elements[n] ? f.elements[n].value : ''; };
    if (kind === 'code') return enterClass(val('code'));
    if (kind === 'kuerzel') {
      var kz = val('kz').toUpperCase().replace(/[^A-ZÄÖÜ0-9]/g, '');
      if (kz.length < 2) return go('newKuerzel', { code: S.ctx.code, err: 'Bitte mindestens 2 Buchstaben.' });
      var taken = Object.keys(store.profiles).some(function (k) { var p = store.profiles[k]; return p.klasse === S.ctx.code && p.kuerzel === kz; });
      if (taken) return go('newKuerzel', { code: S.ctx.code, err: 'Dieses Kürzel gibt es in deiner Klasse auf diesem iPad schon. Tippe es in der Liste an.' });
      return go('pwSet', { code: S.ctx.code, kuerzel: kz, step: 1, sel: [] });
    }
    if (kind === 'answer') {
      var w = S.ctx.list[S.ctx.i], typed = val('answer'), r = check(typed, w.fr);
      if (!typed.trim()) return;
      return kkAnswer(r !== 'no', r, typed);
    }
    if (kind === 'duel') {
      var k = findDeck(S.deck);
      var c = { rounds: +val('rounds') || 10, round: 0, list: shuffle(k.words), p: [{ name: P().kuerzel, score: 0 }, { name: (val('p2') || 'Gast').toUpperCase(), score: 0 }] };
      while (c.list.length < c.rounds) c.list = c.list.concat(shuffle(k.words));
      duelNewRound(c);
      return go('duel', c);
    }
    if (kind === 'pin') {
      var pin = val('pin');
      if (!D().pinHash) {
        if (!/^\d{4,}$/.test(pin)) return go('pin', { err: 'Die PIN braucht mindestens 4 Ziffern.' });
        if (pin !== val('pin2')) return go('pin', { err: 'Die beiden PINs sind nicht gleich.' });
        return sha(pin).then(function (h) { draft().pinHash = h; save(); S.teacher = true; S.me = null; S.tab = 'karteien'; go('teacher'); });
      }
      return sha(pin).then(function (h) {
        if (h === D().pinHash) { S.teacher = true; S.me = null; S.tab = 'karteien'; go('teacher'); }
        else go('pin', { err: 'Falsche PIN.' });
      });
    }
    if (kind === 'classAdd') {
      var code = val('cc').toUpperCase().replace(/\s+/g, ''), name = val('cn').trim();
      if (!/^[A-Z0-9ÄÖÜ-]{2,12}$/.test(code)) return go('teacher', { err: 'Der Code braucht 2 bis 12 Buchstaben oder Ziffern, ohne Leerzeichen.' });
      if (findClass(code)) return go('teacher', { err: 'Diesen Code gibt es schon.' });
      draft().classes.push({ code: code, name: name || code }); save();
      return go('teacher');
    }
    if (kind === 'pinChange') {
      var np = val('np');
      if (!/^\d{4,}$/.test(np)) return go('teacher', { msg: 'Die PIN braucht mindestens 4 Ziffern.' });
      return sha(np).then(function (h) { draft().pinHash = h; save(); go('teacher', { msg: 'PIN geändert. Sie gilt auf allen Geräten, sobald die neue Version online ist.' }); });
    }
  });

  render();
})();
</script>
</body>
</html>
