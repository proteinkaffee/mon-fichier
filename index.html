.tile {

  padding: 16px; display: grid; gap: 6px; align-content: start; min-height: 110px; box-shadow: var(--shadow);
}
.tile:hover { border-color: var(--blue); }

.tile span { color: var(--ink-soft); font-size: .95rem; }

.tile.mf3 { border-left-color: var(--mf3); }
.tile.mf4 { border-left-color: var(--mf4); }
.tone { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; color: #fff; }
.tone.mf3 { background: var(--mf3); } .tone.mf4 { background: var(--mf4); }

.who-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.who { min-height: 80px; border-radius: 16px; border: 2px solid var(--border); background: var(--sheet); font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; color: var(--blue); }

.pics { display: grid; grid-template-columns: repeat(3, minmax(0, 96px)); gap: 12px; justify-content: center; }

.box { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; align-items: end; }

.c1 { background: var(--f1); } .c2 { background: var(--f2); } .c3 { background: var(--f3); } .c4 { background: var(--f4); } .c5 { background: var(--f5); }

/* Lernkarte */
.card {
  background: var(--sheet); border: 2px solid var(--border); border-radius: 22px; box-shadow: var(--shadow);
  padding: 26px 20px; display: grid; gap: 14px; justify-items: center; text-align: center; min-height: 260px; align-content: center;
}
.card .emo { font-size: 4.2rem; line-height: 1; }
.card .de { font-size: 1.6rem; font-weight: 700; }

.progress i { display: block; height: 100%; background: var(--blue); border-radius: 999px; transition: width .3s; }
.progress.stacked { display: flex; height: 14px; }
.progress.stacked i { border-radius: 0; }

.mid { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--sheet); border-block: 2px solid var(--border); }

.stars { font-size: 2.4rem; letter-spacing: 6px; color: var(--f3); }
.pop { animation: pop .35s ease-out; }

  body { font-size: 17px; }

  .card .fr { font-size: 1.7rem; }
  .half .opt { min-height: 56px; font-size: 1rem; }
}

    return shuffle(others.concat([target]));
  }

      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"' && cell === '') q = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return String(x).trim(); }); });

  function rowsToDecks(rows, fallback) {

    var isHeader = h.some(function (x) { return /franz|fran[cç]ais|deutsch|^fr$|^de$/.test(x); });
    if (isHeader) {

  // ---------- Spielabläufe ----------
  function kkStart() {

    pool = shuffle(pool).sort(function (a, b) { return fachOf(pr, a) - fachOf(pr, b); }).slice(0, 12);
    if (!pool.length) return;
    go('kk', { list: pool, i: 0, state: 'ask', right: 0 });
  }
  function kkAnswer(ok, result, typed) {
    var c = S.ctx, k = findDeck(S.deck), w = c.list[c.i];
    c.fromFach = fachOf(prog(k.id), w);
    grade(k.id, w, ok, true);
    if (ok) c.right++;
    c.result = result; c.typed = typed; c.state = 'done';
    speak(w.fr);
    render();
  }
  function kkNext() {
    var c = S.ctx;
    if (c.i + 1 >= c.list.length) {
      var k = findDeck(S.deck), cnt = counts(k, prog(k.id));
      return go('result', { title: 'Geschafft!', right: c.right, total: c.list.length, text: c.right + ' von ' + c.list.length + ' Karten richtig.', again: 'kkStart', extra: boxHtml(cnt, k.words.length) });
    }
    c.i++; c.state = 'ask'; c.typed = ''; c.spoken = false; render();
  }
  function chooseStart(mode) {
    var k = findDeck(S.deck);
    var list = shuffle(k.words).slice(0, 10);
    go('choose', { mode: mode, list: list, i: 0, right: 0, opts: makeOptions(k.words, list[0], 4) });
  }
  function memStart() {
    var k = findDeck(S.deck);
    var unique = [], seen = {};
    shuffle(k.words).forEach(function (w) { if (!seen[w.de] && !seen[w.fr]) { seen[w.de] = seen[w.fr] = 1; unique.push(w); } });
    var words = unique.slice(0, 6);
    var cards = shuffle(words.map(function (w) { return { w: w, side: 'fr' }; }).concat(words.map(function (w) { return { w: w, side: 'de' }; })));
    go('memory', { cards: cards, open: [], moves: 0, found: 0, pairs: words.length, busy: false });
  }
  function blitzNext(c) {
    var k = findDeck(S.deck);
    var w = c.pool[c.n % c.pool.length]; c.n++;
    if (c.n % c.pool.length === 0) c.pool = shuffle(c.pool);
    c.w = w; c.opts = makeOptions(k.words, w, 4); c.picked = null;
  }
  function blitzStart() {
    var k = findDeck(S.deck);
    var c = { pool: shuffle(k.words), n: 0, pts: 0, streak: 0, left: 60, t0: Date.now(), right: 0, total: 0 };
    blitzNext(c);
    go('blitz', c);
  }
  function blitzEnd() {
    var c = S.ctx, p = P();
    if (c.ended) return; c.ended = true;
    store.scores.push({ game: 'blitz', deck: S.deck, klasse: p.klasse, kuerzel: p.kuerzel, pid: p.id, pts: c.pts, ts: Date.now() });
    store.scores = store.scores.slice(-500);
    p.best = p.best || {};
    var bestKey = 'blitz:' + S.deck, rec = c.pts > (p.best[bestKey] || 0);

    var hs = topScores('blitz', S.deck, p.klasse, 5);
    go('result', { title: rec && c.pts > 0 ? 'Neuer persönlicher Rekord!' : 'Zeit ist um!', big: c.pts, right: c.right, total: c.total, text: c.right + ' von ' + c.total + ' richtig. Punkte:', again: 'blitzStart', extra: '<div style="width:100%">' + scoreTable(hs) + '</div>' });
  }
  function duelNewRound(c) {
    var k = findDeck(S.deck);

  function duelEnd() {

    go('result', { title: text, right: Math.max(a.score, b.score), total: c.rounds, text: a.name + ' ' + a.score + ' : ' + b.score + ' ' + b.name, again: 'duelSetup' });

  // ---------- Ereignisse ----------

    choosePick: function (el) {

      later(function () {

        c.i++; c.picked = null; c.spoken = false; c.opts = makeOptions(findDeck(S.deck).words, c.list[c.i], 4); render();
      }, ok ? 900 : 1800);
    },
    memStart: memStart,
    memFlip: function (el) {
      var c = S.ctx, i = +el.dataset.i, m = c.cards[i];
      if (c.busy || m.done || c.open.indexOf(i) >= 0) return;
      c.open.push(i);
      if (m.side === 'fr') speak(m.w.fr);
      if (c.open.length === 2) {
        c.moves++;
        var a = c.cards[c.open[0]], b = c.cards[c.open[1]];
        if (a.w.id === b.w.id) {
          a.done = b.done = true; c.open = []; c.found++;
          if (c.found === c.pairs) {
            var p = P(); p.best = p.best || {}; var key = 'mem:' + S.deck;
            var rec = !p.best[key] || c.moves < p.best[key]; if (rec) p.best[key] = c.moves; save();
            render();
            return later(function () { go('result', { title: rec ? 'Neuer Rekord!' : 'Alle Paare gefunden!', big: c.moves, right: c.pairs, total: c.moves, text: 'Züge gebraucht. Dein Rekord: ' + p.best[key] + ' Züge.', again: 'memStart' }); }, 700);
          }
        } else {
          c.busy = true;
          later(function () { c.open = []; c.busy = false; render(); }, 1300);
        }
      }
      render();
    },
    blitzStart: blitzStart,
    blitzPick: function (el) {
      var c = S.ctx; if (c.picked || c.ended) return;
      c.picked = el.dataset.id; c.total++;
      var ok = c.picked === c.w.id;
      grade(S.deck, c.w, ok, false);
      if (ok) { c.right++; c.streak++; c.pts += 10 + Math.min(10, (c.streak - 1) * 2); } else { c.streak = 0; }
      var keepTimer = c.timer;
      var html = VIEWS.blitz(); $app.innerHTML = layout(html); c.timer = keepTimer;
      later(function () { if (c.ended) return; blitzNext(c); $app.innerHTML = layout(VIEWS.blitz()); }, ok ? 350 : 1100);
    },
    duelSetup: function () { go('duelSetup'); },
    duelPick: function (el) {
      var c = S.ctx, p = +el.dataset.p, st = c.p[p];
      if (c.winner != null || st.locked || c.reveal) return;
      if (el.dataset.id === c.w.id) {
        c.winner = p; st.score++;
        render();
        later(nextDuel, 1100);
      } else {
        st.locked = true; st.wrong = el.dataset.id;
        if (c.p[0].locked && c.p[1].locked) { c.reveal = true; speak(c.w.fr); render(); later(nextDuel, 1600); }
        else render();
      }
    },
    duelQuit: function () { go('deck'); },
    // Lehrperson
    teacherOpen: function () { go('pin'); },

    pwReset: function (el) { var p = store.profiles[el.dataset.id]; p.pw = null; save(); S.ctx.msg = p.kuerzel + ' wählt beim nächsten Anmelden ein neues Bild-Passwort.'; render(); },
    profileDel: function (el) { S.ctx.delProfile = el.dataset.id; render(); },

    copyTable: function () {

      (S.ctx.tableRows || []).forEach(function (r) { lines.push([r.p.kuerzel, r.c[1], r.c[2], r.c[3], r.c[4], r.c[5], fmtDate(r.p.last), r.hard.join(', '), deck ? deck.title : ''].join('\t')); });

  };
  function nextDuel() {

  function readRows() {

    var t = document.getElementById('dt'); if (t) c.title = t.value;

  function picDone() {

      if (c.first.join() !== c.sel.join()) { c.step = 1; c.sel = []; c.first = null; c.err = 'Das war nicht gleich. Bitte nochmals von vorne.'; return render(); }
      var p;

      else { p = { id: 'p' + hash(c.code + c.kuerzel + Date.now() + Math.random()), klasse: c.code, kuerzel: c.kuerzel, created: Date.now() }; store.profiles[p.id] = p; }

      if (kz.length < 2) return go('newKuerzel', { code: S.ctx.code, err: 'Bitte mindestens 2 Buchstaben.' });
      var taken = Object.keys(store.profiles).some(function (k) { var p = store.profiles[k]; return p.klasse === S.ctx.code && p.kuerzel === kz; });
      if (taken) return go('newKuerzel', { code: S.ctx.code, err: 'Dieses Kürzel gibt es in deiner Klasse auf diesem iPad schon. Tippe es in der Liste an.' });
      return go('pwSet', { code: S.ctx.code, kuerzel: kz, step: 1, sel: [] });
    }
    if (kind === 'answer') {
      var w = S.ctx.list[S.ctx.i], typed = val('answer'), r = check(typed, w.fr);
      if (!typed.trim()) return;
      return kkAnswer(r !== 'no', r, typed);
    }
    if (kind === 'duel') {
      var k = findDeck(S.deck);
      var c = { rounds: +val('rounds') || 10, round: 0, list: shuffle(k.words), p: [{ name: P().kuerzel, score: 0 }, { name: (val('p2') || 'Gast').toUpperCase(), score: 0 }] };
      while (c.list.length < c.rounds) c.list = c.list.concat(shuffle(k.words));
      duelNewRound(c);
      return go('duel', c);
    }
    if (kind === 'pin') {
      var pin = val('pin');
      if (!D().pinHash) {
        if (!/^\d{4,}$/.test(pin)) return go('pin', { err: 'Die PIN braucht mindestens 4 Ziffern.' });
        if (pin !== val('pin2')) return go('pin', { err: 'Die beiden PINs sind nicht gleich.' });
        return sha(pin).then(function (h) { draft().pinHash = h; save(); S.teacher = true; S.me = null; S.tab = 'karteien'; go('teacher'); });
      }
      return sha(pin).then(function (h) {
        if (h === D().pinHash) { S.teacher = true; S.me = null; S.tab = 'karteien'; go('teacher'); }
        else go('pin', { err: 'Falsche PIN.' });
      });
    }
    if (kind === 'classAdd') {
      var code = val('cc').toUpperCase().replace(/\s+/g, ''), name = val('cn').trim();
      if (!/^[A-Z0-9ÄÖÜ-]{2,12}$/.test(code)) return go('teacher', { err: 'Der Code braucht 2 bis 12 Buchstaben oder Ziffern, ohne Leerzeichen.' });
      if (findClass(code)) return go('teacher', { err: 'Diesen Code gibt es schon.' });
      draft().classes.push({ code: code, name: name || code }); save();
      return go('teacher');
    }
    if (kind === 'pinChange') {
      var np = val('np');
      if (!/^\d{4,}$/.test(np)) return go('teacher', { msg: 'Die PIN braucht mindestens 4 Ziffern.' });
      return sha(np).then(function (h) { draft().pinHash = h; save(); go('teacher', { msg: 'PIN geändert. Sie gilt auf allen Geräten, sobald die neue Version online ist.' }); });
    }
  });

  function checkUpdate() {
    if (MODE !== 'datei' || !window.fetch || S.updateAvailable) return;
    fetch(location.href.split('#')[0], { cache: 'reload' }).then(function (r) { return r.ok ? r.text() : null; }).then(function (t) {
      if (!t) return;
      var data = /<script type="application\/json" id="kartei-daten">([\s\S]*?)<\/script>/.exec(t);
      var code = /<script id="app-js">([\s\S]*?)<\/script>/.exec(t);
      if (!data || !code) return;
      if (data[1].trim() !== document.getElementById('kartei-daten').textContent.trim() || code[1] !== document.getElementById('app-js').textContent) {
        S.updateAvailable = true;
        if (['start', 'who', 'home', 'deck', 'teacher', 'result'].indexOf(S.view) >= 0) render();
      }
    }).catch(function () { /* offline: nichts tun */ });
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checkUpdate(); });

  render();
  checkUpdate();
})();
</script>
</body>
